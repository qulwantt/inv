<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 8 - Гра "Більше число"</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }
        .game-container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap; 
        }
        .player-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #000;
        }
        .score-box {
            background-color: #00a2e8;
            color: black;
            font-size: 20px;
            font-weight: bold;
            padding: 5px 40px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .number-circle {
            background-color: #fff200;
            border: 3px solid black;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            color: black;
        }
        .generate-btn {
            background-color: #00ff00;
            color: black;
            border: none;
            border-radius: 8px;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .generate-btn:active {
            transform: scale(0.95);
        }
        @media (max-width: 500px) {
            .game-container { flex-direction: column; gap: 20px; }
            .generate-btn { order: 3; margin-top: 20px; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="player-section">
            <div class="player-name" id="playerName">User</div>
            <div class="score-box" id="userScore">0</div>
            <div class="number-circle" id="userNumber"></div>
        </div>

        <div>
            <button class="generate-btn" onclick="generateNumbers()">Generate</button>
        </div>

        <div class="player-section">
            <div class="player-name">Computer</div>
            <div class="score-box" id="compScore">0</div>
            <div class="number-circle" id="compNumber"></div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
