<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 10 - Однорукий бандит</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }
        .game-container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        .player-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .attempt-text {
            font-size: 18px;
            font-style: italic;
            color: #555;
            margin-bottom: 20px;
        }
        .generate-btn {
            background-color: #00ff00;
            color: black;
            border: none;
            border-radius: 8px;
            padding: 12px 40px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            transition: transform 0.1s;
        }
        .generate-btn:active {
            transform: scale(0.95);
        }
        .generate-btn:disabled {
            background-color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        .slot-machine {
            display: flex;
            background: linear-gradient(to right, #444, #777, #444);
            padding: 10px;
            border-radius: 10px;
            gap: 10px;
            border: 4px solid #222;
        }
        .column {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .cell {
            width: 90px;
            height: 90px;
            background-color: #6a7fc1;
            border: 2px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            transition: all 0.4s ease; 
        }
        @media (max-width: 400px) {
            .cell { width: 70px; height: 70px; font-size: 45px; }
            .generate-btn { padding: 10px 30px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="player-name" id="userName">User</div>
        <div class="attempt-text" id="attemptCount">Спроба 0 з 3</div>
        
        <button class="generate-btn" id="generateBtn" onclick="playGame()">Generate</button>

        <div class="slot-machine">
            <div class="column" id="col0">
                <div class="cell" id="c0r0"></div>
                <div class="cell" id="c0r1"></div>
                <div class="cell" id="c0r2"></div>
            </div>
            <div class="column" id="col1">
                <div class="cell" id="c1r0"></div>
                <div class="cell" id="c1r1"></div>
                <div class="cell" id="c1r2"></div>
            </div>
            <div class="column" id="col2">
                <div class="cell" id="c2r0"></div>
                <div class="cell" id="c2r1"></div>
                <div class="cell" id="c2r2"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
